apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-deployment
  labels:
    app: opspilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opspilot
  template:
    metadata:
      labels:
        app: opspilot
    spec:
      containers:
      - name: opspilot
        image: opspilot:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
